name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Native policy and codec tests
        run: |
          g++ -std=c++11 -Wall -Wextra -pedantic tests/test_switch_only.cpp -o /tmp/test-switch
          /tmp/test-switch
          g++ -std=c++11 -Iinclude tests/test_codec.cpp -lmbedcrypto -o /tmp/test-codec
          /tmp/test-codec
      - run: python -m platformio run
      - run: python -m platformio run -d capture
